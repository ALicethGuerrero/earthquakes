services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PUBLIC_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c 'exec uvicorn src.api.main:app --host "$$API_HOST" --port "$$API_PORT"'
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379/0}
    ports:
      - "${API_PUBLIC_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion:
    build: .
    command: python ingestion.py
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379/0}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-init:
    image: apache/airflow:2.10.4-python3.11
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-SequentialExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-sqlite:////opt/airflow/airflow.db}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
      PYTHONPATH: /opt/airflow/project
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-pymongo==4.10.1 pydantic==2.10.5 pydantic-settings==2.7.1}
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: >-
      bash -c "airflow db migrate && airflow users create
      --username \"$$AIRFLOW_ADMIN_USERNAME\"
      --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      --firstname \"$$AIRFLOW_ADMIN_FIRSTNAME\"
      --lastname \"$$AIRFLOW_ADMIN_LASTNAME\"
      --role Admin --email \"$$AIRFLOW_ADMIN_EMAIL\" || true"
    depends_on:
      mongo:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.4-python3.11
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-SequentialExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-sqlite:////opt/airflow/airflow.db}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
      PYTHONPATH: /opt/airflow/project
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-pymongo==4.10.1 pydantic==2.10.5 pydantic-settings==2.7.1}
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.11
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-SequentialExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-sqlite:////opt/airflow/airflow.db}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
      PYTHONPATH: /opt/airflow/project
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-pymongo==4.10.1 pydantic==2.10.5 pydantic-settings==2.7.1}
    volumes:
      - airflow_data:/opt/airflow
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
  airflow_data:
