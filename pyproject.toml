[project]
name = "earthquake-events-platform"
version = "0.1.0"
description = "Near-real-time USGS earthquake ingestion and reporting platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "prometheus-fastapi-instrumentator==7.0.2",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "pymongo==4.10.1",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
